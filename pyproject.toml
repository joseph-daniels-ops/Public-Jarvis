[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-jarvis"
version = "0.1.0"
description = "Orquestrador assíncrono de agentes autônomos com roteamento multi-LLM, memória episódica SQLite e execução shell segura."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
